    </g>
    <text x="164" y="356" font-size="14" fill="#6C4B94" font-weight="700">The coordinator hands each task a guide; a worker subagent reads only that file.</text>
    <g fill="none" stroke="#6C4B94" stroke-width="2" stroke-dasharray="6 4">
      <path d="M144 326 V378 H936"/>
