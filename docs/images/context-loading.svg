<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title description">
  <title id="title">Harness Research: progressive context loading</title>
  <desc id="description">Progressive disclosure, cumulative instruction tokens measured with cl100k_base. Discovery 38 tokens, installed bootstrap 490 tokens, guidance entry ~1.1k. Paths: checked research run ~4.8k, verify/again/reuse/refresh ~1.9k, status or resume ~1.7k, chat-only answer ~2.1k. Worker subagents read only their own contract: researcher ~1.1k, checker 541 tokens, writer or reviewer 580 tokens, refresh reader 668 tokens. Legacy paths: manual workflow ~3.3k, comparative outlines ~1.8k–3.9k, source strategies ~5.1k–5.4k, older Brand records ~1.5k. One path is loaded, not the sum.</desc>
  <!-- Input digest: f0a52af4a3896d3a834c3dd16c6e7dabcc100de215d338fb1349a17b2b6238ee -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#005C8A"/></marker><marker id="arrow-worker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6C4B94"/></marker></defs>
  <rect width="1080" height="700" rx="16" fill="#F5F7F9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1B1D36">
    <text x="24" y="36" font-size="24" font-weight="700">Load what the task needs</text>
    <text x="24" y="59" font-size="15">Cumulative instruction tokens. Each request takes one path; branches are not added together.</text>
    <g fill="none" stroke="#005C8A" stroke-width="2" marker-end="url(#arrow)">
      <path d="M324 128 H390"/>
