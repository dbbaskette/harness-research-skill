<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title description">
  <title id="title">Harness Research: progressive context loading</title>
  <desc id="description">Discovery metadata: 36 tokens. Installed bootstrap: 574 tokens. Bootstrap + current guidance entry: ~1.2k. Investigator stage: 822 tokens. Synthesis writer stage: 939 tokens. Independent reviewer stage: ~1.1k. New synthesis: coordinator entry and workflow: ~3.4k. New synthesis: all stages in one context: ~6.2k. Synthesis resume, verify or refresh: ~2.0k. Each stage loads when needed. Branches are not added together; all-stages total is shown explicitly.</desc>
  <!-- Input digest: 5e14e63e2aaf0d847f8dd8b3963c2e0956f2e009a5b4e9c3f77e63021c78d994 -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#005C8A"/></marker></defs>
  <rect width="1080" height="700" rx="16" fill="#F5F7F9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1B1D36">
    <text x="24" y="36" font-size="24" font-weight="700">Load what the task needs</text>
    <text x="24" y="59" font-size="15">New work follows synthesis. Stage references load progressively; legacy routes stay separate.</text>
    <g fill="none" stroke="#005C8A" stroke-width="2" marker-end="url(#arrow)">
      <path d="M352 128 H376"/><path d="M704 128 H728"/>
      <path d="M892 176 V202 H188 V230"/><path d="M540 202 V230"/>
    </g>
    <text x="24" y="356" font-size="14" fill="#6C4B94" font-weight="700">Each stage reads its own contract; independent review remains a separate invocation.</text>
    <text x="24" y="556" font-size="14" fill="#6B7280" font-weight="700">Compatibility routes are loaded only when the existing work needs them.</text>
  <g transform="translate(24 80)">
    <rect width="328" height="96" rx="12" fill="white" stroke="#005C8A" stroke-width="2"/>
    <text x="16" y="26" font-size="17" font-weight="700" fill="#005C8A">Skill discovery</text>
    <text x="16" y="56" font-size="26" font-weight="700">36 tokens</text>
    <text x="16" y="80" font-size="13">Name and description, always visible</text>
  </g>
  <g transform="translate(376 80)">
